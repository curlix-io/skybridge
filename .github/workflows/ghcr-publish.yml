# Tag-driven GHCR publish: builds and pushes the single skybridge image
# ghcr.io/curlix-io/skybridge. One binary (./cmd/skybridge), one image — the role
# (agent/gateway/edge/labeller) is picked by the container's runtime args at deploy time, not by
# which tag was pulled. Runs alongside release.yml on the same v* tag push so binaries and images
# publish together.
name: ghcr-publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/curlix-io/skybridge:${{ steps.version.outputs.version }}
            ghcr.io/curlix-io/skybridge:latest
