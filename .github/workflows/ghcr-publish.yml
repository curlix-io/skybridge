# Tag-driven GHCR publish: builds and pushes the skybridge binaries (agent, gateway, edge, and
# edge-querystudio) as separate tags of the single public image ghcr.io/curlix-io/skybridge.
# agent/gateway build from the root Dockerfile's SKYBRIDGE_CMD build arg (same one
# goreleaser/release.yml uses for the binary archives); edge builds from Dockerfile.edge instead,
# since it bundles the AWS CLI that edge's aws_readonly_cli tool shells out to
# (internal/edge/awsexec/cli.go) — the root Dockerfile's distroless base has no shell/package
# manager to add that with. edge-querystudio is a second build from the same Dockerfile.edge with
# BUILD_TAGS=querystudio, matching `make edge-querystudio` — the plain edge image never has Query
# Studio dispatch compiled in (CLAUDE.md's "default build has zero optional-integration code"
# contract), so anyone needing Query Studio must deploy edge-querystudio, not assume it's already
# in edge-<version>. Runs alongside release.yml on the same v* tag push so binaries and images
# publish together.
name: ghcr-publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - cmd: skybridge-agent
            tag_prefix: agent
            dockerfile: Dockerfile
          - cmd: skybridge-gateway
            tag_prefix: gateway
            dockerfile: Dockerfile
          - cmd: skybridge-edge
            tag_prefix: edge
            dockerfile: Dockerfile.edge
            build_tags: ""
          - cmd: skybridge-edge
            tag_prefix: edge-querystudio
            dockerfile: Dockerfile.edge
            build_tags: querystudio
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            SKYBRIDGE_CMD=${{ matrix.cmd }}
            BUILD_TAGS=${{ matrix.build_tags }}
          push: true
          tags: |
            ghcr.io/curlix-io/skybridge:${{ matrix.tag_prefix }}-${{ steps.version.outputs.version }}
            ghcr.io/curlix-io/skybridge:${{ matrix.tag_prefix }}-latest
