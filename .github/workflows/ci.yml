name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "These files need gofmt:"; echo "$out"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: make build

      - name: test (race + coverage)
        run: go test -race -coverprofile=coverage.txt ./...

  # internal/edge/{dbexec,dbquery,studiotransport} are excluded from the default build (see the
  # `querystudio` build tag, Makefile) — they'd be silently unbuilt/unvetted/untested by the job
  # above once tagged out, so this leg exercises them explicitly.
  build-test-querystudio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: vet (querystudio)
        run: go vet -tags querystudio ./...

      - name: build (querystudio)
        run: make edge-querystudio

      - name: test (querystudio, race + coverage)
        run: go test -race -tags querystudio -coverprofile=coverage-querystudio.txt ./...
