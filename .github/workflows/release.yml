# Tag-driven release: cross-compiled binaries via GoReleaser. Assumes this directory is the
# repository root (after extraction). GoReleaser's brews: block (.goreleaser.yaml) also regenerates
# Formula/skybridge.rb and pushes it straight to this repo's main branch using the same
# GITHUB_TOKEN below — contents:write on this repo is enough since the tap lives here, not a
# separate homebrew-tap repo.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
