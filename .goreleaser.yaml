version: 2

project_name: skybridge

before:
  hooks:
    - go mod tidy

builds:
  - id: skybridge-agent
    main: ./cmd/skybridge-agent
    binary: skybridge-agent
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  - id: skybridge-gateway
    main: ./cmd/skybridge-gateway
    binary: skybridge-gateway
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  - id: skybridge-edge
    main: ./cmd/skybridge-edge
    binary: skybridge-edge
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

brews:
  - name: skybridge
    ids: [skybridge-agent, skybridge-gateway, skybridge-edge]
    repository:
      owner: curlix-io
      name: skybridge
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/curlix-io/skybridge"
    description: "Egress-only data plane for governed native database access, plus the skybridge-edge connector for Curlix."
    license: "Apache-2.0"
    install: |
      bin.install "skybridge-agent"
      bin.install "skybridge-gateway"
      bin.install "skybridge-edge"
    test: |
      system "#{bin}/skybridge-agent", "--help"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
