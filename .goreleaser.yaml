version: 2

project_name: skybridge

before:
  hooks:
    - go mod tidy

builds:
  - id: skybridge
    main: ./cmd/skybridge
    binary: skybridge
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

brews:
  - name: skybridge
    ids: [skybridge]
    repository:
      owner: curlix-io
      name: skybridge
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/curlix-io/skybridge"
    description: "Egress-only data plane for governed native database access, plus the edge connector for Curlix — one binary, role picked by the first argument (agent/gateway/edge/labeller)."
    license: "Apache-2.0"
    install: |
      bin.install "skybridge"
    test: |
      system "#{bin}/skybridge", "--help"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
