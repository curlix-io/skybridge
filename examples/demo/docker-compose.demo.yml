# Standalone Presidio pair for the redaction demo (examples/demo/run-demo.sh), isolated on
# non-default host ports so it doesn't collide with deploy/docker-compose.yml or any other stack.
name: skybridge-redaction-demo

services:
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: skybridge-demo-presidio-analyzer
    command: ["gunicorn", "-c", "/gunicorn.conf.py", "app:create_app()"]
    volumes:
      - ../../deploy/presidio-analyzer-gunicorn.conf.py:/gunicorn.conf.py:ro
    ports:
      - "13000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    container_name: skybridge-demo-presidio-anonymizer
    command: ["gunicorn", "-c", "/gunicorn.conf.py", "app:create_app()"]
    volumes:
      - ../../deploy/presidio-anonymizer-gunicorn.conf.py:/gunicorn.conf.py:ro
    ports:
      - "13001:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10
