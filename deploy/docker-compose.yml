# Run skybridge-edge next to your network egress. Raw rows are masked here, in-process, before
# anything leaves the network. Point SKYBRIDGE_UPSTREAM at the target database.
#
#   cd skybridge/deploy
#   SKYBRIDGE_UPSTREAM=db.internal:5432 docker compose up -d
#   psql "postgres://user:pass@localhost:15432/appdb"
#
# edge is the unified binary: it co-hosts the wire proxy (started below whenever SKYBRIDGE_UPSTREAM
# is set — the same masking pipeline the plain skybridge-agent binary runs) and, once
# SKYBRIDGE_EDGE_GATEWAY is also set, dials out to a Connector Gateway for AWS/k8s tool dispatch —
# no separate agent container needed for a deployment that wants both. Leave
# SKYBRIDGE_EDGE_GATEWAY unset to run the wire proxy alone.
#
# PII masking is on by default via Microsoft Presidio (analyzer + anonymizer, below). edge calls
# Presidio's "analyze"/"anonymize" HTTP endpoints over the compose network; any other service
# exposing that same shape also works —
# override SKYBRIDGE_MASK_ANALYZE_URL / SKYBRIDGE_MASK_ANONYMIZE_URL to point elsewhere, or set both
# to empty to run as a governed passthrough with no content masking.
#
# labeller is an optional add-on behind its own Compose profile, since it needs external services
# this repo doesn't ship (an LLM endpoint + control-plane pii-path-labels URL) — `docker compose up
# -d` alone still starts only edge+Presidio (3 containers). Bring it in with:
#   docker compose --profile labeller up -d
name: skybridge

services:
  edge:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SKYBRIDGE_CMD: skybridge-edge
    container_name: skybridge-edge
    restart: unless-stopped
    depends_on:
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
    environment:
      # Wire proxy (co-hosted — internal/config's Edge.WireProxyEnabled()):
      - SKYBRIDGE_DB_TYPE=${SKYBRIDGE_DB_TYPE:-postgres}
      - SKYBRIDGE_LISTEN=:15432
      - SKYBRIDGE_UPSTREAM=${SKYBRIDGE_UPSTREAM:?set the database host:port}
      # Remote masker, Presidio by default (set both to empty to disable):
      - SKYBRIDGE_MASK_ANALYZE_URL=${SKYBRIDGE_MASK_ANALYZE_URL:-http://presidio-analyzer:3000/analyze}
      - SKYBRIDGE_MASK_ANONYMIZE_URL=${SKYBRIDGE_MASK_ANONYMIZE_URL:-http://presidio-anonymizer:3000/anonymize}
      - SKYBRIDGE_MASK_LANGUAGE=${SKYBRIDGE_MASK_LANGUAGE:-en}
      # Entities sent to /analyze. Empty falls back to a low-cost regex/rule-based set (no spaCy
      # inference); add NER-backed types (PERSON, LOCATION, ORGANIZATION, NRP) only if you need
      # them — they're expensive and prone to false positives on ordinary business data.
      - SKYBRIDGE_MASK_ENTITIES=${SKYBRIDGE_MASK_ENTITIES:-}
      # Per-entity /anonymize strategies (Presidio "anonymizers" object, JSON). Empty replaces every
      # detected span with "[redacted]"; override to keep partial info, e.g.:
      #   {"US_SSN":{"type":"mask","masking_char":"*","chars_to_mask":5,"from_end":false}}
      - SKYBRIDGE_MASK_ANONYMIZERS=${SKYBRIDGE_MASK_ANONYMIZERS:-}
      # Custom PII types via Presidio's ad_hoc_recognizers (sent on every /analyze call) — the
      # supported way to detect org-specific patterns (e.g. an internal account-number format)
      # without building and hosting a custom Presidio analyzer image. Presidio's own
      # recognizer_registry.recognizers YAML shape; see ./recognizers.example.yaml. Local dev:
      # mount a file and set SKYBRIDGE_MASK_RECOGNIZERS_FILE (below), pointed at
      # ./recognizers.example.yaml (mounted at /etc/skybridge/recognizers.yaml). Production
      # (ECS/Fargate): set SKYBRIDGE_MASK_RECOGNIZERS_YAML with the YAML content inline instead —
      # see docs/design/skybridge-custom-pii-recognizers.md for the SSM Parameter Store wiring.
      # SKYBRIDGE_MASK_RECOGNIZERS_YAML takes priority over the file when both are set. Unset by
      # default (no custom recognizers).
      - SKYBRIDGE_MASK_RECOGNIZERS_YAML=${SKYBRIDGE_MASK_RECOGNIZERS_YAML:-}
      - SKYBRIDGE_MASK_RECOGNIZERS_FILE=${SKYBRIDGE_MASK_RECOGNIZERS_FILE:-}
      # best-effort (default) forwards a value unmasked if Presidio errors/is unreachable, so an
      # outage never blocks legitimate queries. strict aborts the row/connection instead — use this
      # for compliance-sensitive deployments where unmasked content must never reach the client.
      - SKYBRIDGE_MASK_MODE=${SKYBRIDGE_MASK_MODE:-best-effort}
      # Column overlay (off by default): JSON map of column name -> replacement token.
      - SKYBRIDGE_PII_OVERLAY=${SKYBRIDGE_PII_OVERLAY:-}
      # Connector Gateway call-home (optional — AWS/k8s tool dispatch, internal/edge). Leave
      # SKYBRIDGE_EDGE_GATEWAY unset to run the wire proxy alone with no outbound gateway dial.
      - SKYBRIDGE_EDGE_GATEWAY=${SKYBRIDGE_EDGE_GATEWAY:-}
      - SKYBRIDGE_ORG_ID=${SKYBRIDGE_ORG_ID:-}
      - SKYBRIDGE_EDGE_ID=${SKYBRIDGE_EDGE_ID:-}
      - SKYBRIDGE_TOKEN=${SKYBRIDGE_TOKEN:-}
      - SKYBRIDGE_AWS_REGION=${SKYBRIDGE_AWS_REGION:-}
      - SKYBRIDGE_K8S_KUBECONFIG=${SKYBRIDGE_K8S_KUBECONFIG:-}
      - SKYBRIDGE_K8S_CONTEXT=${SKYBRIDGE_K8S_CONTEXT:-}
    volumes:
      # Mounted so SKYBRIDGE_MASK_RECOGNIZERS_FILE (above) can point at it; harmless if unused.
      - ./recognizers.example.yaml:/etc/skybridge/recognizers.yaml:ro
    ports:
      - "15432:15432"

  # Presidio Analyzer: NLP-based PII detection (POST /analyze). Holds a spaCy model in memory; the
  # heavyweight half of the pair. Image/version per Microsoft's releases:
  # https://github.com/microsoft/presidio/releases
  #
  # The official image's entrypoint only reads WORKERS/PORT (`gunicorn -w $WORKERS -b 0.0.0.0:$PORT
  # app:create_app()`) — threads/preload_app/timeout need a mounted Gunicorn config, so the command
  # is overridden to load one. workers=2 needs preload_app=True or each worker loads its own ~750MB
  # spaCy model copy at startup instead of sharing the master's via copy-on-write. cpu/memory limits
  # below are sized for that same worker count.
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:${PRESIDIO_VERSION:-latest}
    container_name: skybridge-presidio-analyzer
    restart: unless-stopped
    command: ["gunicorn", "-c", "/gunicorn.conf.py", "app:create_app()"]
    volumes:
      - ./presidio-analyzer-gunicorn.conf.py:/gunicorn.conf.py:ro
    cpus: "2.5"
    mem_limit: "2048m"
    mem_reservation: "1024m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

  # Presidio Anonymizer: string substitution on the analyzer's detected spans (POST /anonymize). No
  # ML model, negligible resource cost — same Gunicorn-config-override rationale as the analyzer
  # above.
  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:${PRESIDIO_VERSION:-latest}
    container_name: skybridge-presidio-anonymizer
    restart: unless-stopped
    command: ["gunicorn", "-c", "/gunicorn.conf.py", "app:create_app()"]
    volumes:
      - ./presidio-anonymizer-gunicorn.conf.py:/gunicorn.conf.py:ro
    cpus: "2.0"
    mem_limit: "1024m"
    mem_reservation: "512m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

  # skybridge-labeller: periodic AI-based path-label scan job (docs/AI_PATH_LABELLING_DESIGN.md).
  # Not part of `make build`/the default profile — only starts with
  # `docker compose --profile labeller up -d`. Needs its own read-only DSN into the target
  # database (SKYBRIDGE_LABELLER_DSN) plus an LLM completion endpoint; both are required and have
  # no default, so this profile is opt-in even when explicitly requested.
  labeller:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SKYBRIDGE_CMD: skybridge-labeller
    container_name: skybridge-labeller
    restart: unless-stopped
    profiles:
      - labeller
    environment:
      # No ${VAR:?...} required-var checks here — Compose interpolates every service's environment
      # up front regardless of active profiles, so a required var on this opt-in service would
      # break `docker compose up` even when --profile labeller isn't passed. labeller.go's own
      # validate() already checks these at startup and fails fast with the same env var names.
      - SKYBRIDGE_ORG_ID=${SKYBRIDGE_ORG_ID:-}
      - SKYBRIDGE_TOKEN=${SKYBRIDGE_TOKEN:-}
      - SKYBRIDGE_LABELLER_DB_TYPE=${SKYBRIDGE_LABELLER_DB_TYPE:-postgres}
      - SKYBRIDGE_LABELLER_DSN=${SKYBRIDGE_LABELLER_DSN:-}
      - SKYBRIDGE_LABELLER_DATABASE=${SKYBRIDGE_LABELLER_DATABASE:-}
      - SKYBRIDGE_LABELLER_TABLES=${SKYBRIDGE_LABELLER_TABLES:-}
      - SKYBRIDGE_LABELLER_LLM_ENDPOINT=${SKYBRIDGE_LABELLER_LLM_ENDPOINT:-}
      - SKYBRIDGE_LABELLER_LLM_API_KEY=${SKYBRIDGE_LABELLER_LLM_API_KEY:-}
      - SKYBRIDGE_LABELLER_LLM_CATEGORIES=${SKYBRIDGE_LABELLER_LLM_CATEGORIES:-}
      - SKYBRIDGE_LABELLER_LLM_MIN_CONFIDENCE=${SKYBRIDGE_LABELLER_LLM_MIN_CONFIDENCE:-0.5}
      - SKYBRIDGE_LABELLER_MAX_SAMPLES=${SKYBRIDGE_LABELLER_MAX_SAMPLES:-}
      - SKYBRIDGE_LABELLER_SCAN_INTERVAL_SECONDS=${SKYBRIDGE_LABELLER_SCAN_INTERVAL_SECONDS:-3600}
      - SKYBRIDGE_PATH_LABEL_URL=${SKYBRIDGE_PATH_LABEL_URL:-}
      - SKYBRIDGE_PATH_LABEL_TOKEN=${SKYBRIDGE_PATH_LABEL_TOKEN:-}
